name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem would this feature solve? What use case drives it?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you'd like this to work, with example usage if possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you found any workarounds or alternative approaches?

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Mattermost integration
        - LLM / agent logic
        - CLI / commands
        - Output formatting
        - Configuration
        - Documentation
        - Other
    validations:
      required: true
