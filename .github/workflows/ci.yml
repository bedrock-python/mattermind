name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy src/

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest -m unit --tb=short --cov=src/mattermind --cov-report=term --cov-fail-under=80

  # Sentinel job — the single required status check in the master ruleset. A job
  # counts only when it succeeded: "skipped" means the work did not happen. A job
  # skipped by design (one that runs on pull requests only, say) goes in MAY_SKIP
  # by its job id, and only those may end skipped.
  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          MAY_SKIP: '[]'
        run: |
          NOT_PASSED=$(jq -r --argjson skip "$MAY_SKIP" '
            to_entries[]
            | select((.value.result == "success" or (.value.result == "skipped" and (.key | IN($skip[])))) | not)
            | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$NOT_PASSED" ]; then
            echo "Not passed:"
            echo "$NOT_PASSED"
            exit 1
          fi
          echo "All checks passed."
