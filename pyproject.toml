[project]
name = "mattermind"
version = "0.0.0"
description = "Ask questions about your Mattermost workspace using natural language"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Alex Shalaev", email = "shalaevad.alexey@gmail.com" }]
keywords = ["mattermost", "llm", "ai", "cli", "natural-language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "tenacity>=8.0.0",
    "textual>=0.80.0",
    "orjson>=3.11.9",
]

[project.scripts]
mattermind = "mattermind.cli.app:main"

[project.urls]
Repository = "https://github.com/bedrock-python/mattermind"
Documentation = "https://bedrock-python.github.io/mattermind/"
Changelog = "https://github.com/bedrock-python/mattermind/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/bedrock-python/mattermind/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pre-commit>=4.0.0",
    "types-PyYAML",
]
docs = [
    "zensical>=0.0.37",
    "mkdocstrings-python>=2.0.3",
]

[tool.uv]
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mattermind"]

[tool.hatch.build.targets.sdist]
include = ["/src/mattermind", "/README.md", "/LICENSE", "/CHANGELOG.md"]


[tool.mypy]
python_version = "3.12"
files = ["src/"]
check_untyped_defs = true
disallow_untyped_defs = true
implicit_reexport = false
ignore_missing_imports = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "N", "S", "C4", "SIM", "TRY", "PERF", "RUF", "UP", "ANN", "T20", "PTH", "PLC", "PLE", "PLW"]
ignore = ["TRY003", "S101", "ANN401", "RUF012", "ANN204", "PERF401", "SIM105", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"src/mattermind/agent/prompts.py" = ["E501"]
"src/mattermind/cli/app.py" = ["S110", "S105", "PLC0415"]
"src/mattermind/ui/tui/widgets.py" = ["S110"]
"tests/*" = ["N806", "S101", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: unit tests",
    "integration: integration tests requiring real MM and LLM",
]

[tool.coverage.run]
source = ["src/mattermind"]
omit = [
    "tests/*",
    "*/test_*.py",
    "src/mattermind/cli/*",
    "src/mattermind/ui/*",
    "src/mattermind/config/wizard.py",
]
